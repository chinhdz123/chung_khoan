<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhật ký - {{ app_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      .note-card {
        padding: 1rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        margin-bottom: 1rem;
        background-color: var(--surface-bg);
      }
      .note-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .note-symbol {
        font-weight: bold;
        color: var(--primary-color);
      }
      .note-tags {
        font-size: 0.85em;
        color: var(--text-muted);
      }
      .note-date {
        font-size: 0.85em;
        color: var(--text-muted);
      }
      .note-content {
        white-space: pre-wrap;
        line-height: 1.5;
        font-size: 0.95em;
      }
      .delete-note {
        background: none;
        border: none;
        color: var(--danger-color);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .delete-note:hover {
        background-color: rgba(220, 53, 69, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="page-bg"></div>

    <nav class="top-nav">
      <div class="top-nav-inner">
        <a class="nav-brand" href="/stocks">KyLuat DauTu</a>
        <button class="nav-hamburger" id="navHamburger" aria-label="Menu" aria-expanded="false">☰</button>
        <div class="nav-links" id="navLinks">
          <a class="nav-link" href="/stocks">Danh sách</a>
          <a class="nav-link" href="/settings/holdings">Nắm giữ</a>
          <a class="nav-link active" href="/notes">Nhật ký</a>
        </div>
        <div class="nav-actions">
          <button class="theme-toggle" id="themeToggle" aria-label="Chuyển theme">🌙</button>
        </div>
      </div>
    </nav>

    <main class="layout">
      <header class="page-header">
        <div class="header-content">
          <h1>Nhật ký Kinh nghiệm Đầu tư</h1>
          <p class="subtitle">Ghi lại bài học, sai lầm, hoặc lý do xuống tiền để học hỏi.</p>
        </div>
      </header>

      <section class="grid">
        <article class="panel" style="grid-column: 1 / -1;">
          <h2>Thêm ghi chép mới</h2>
          <form id="noteForm">
            <div class="field-row">
              <label for="noteSymbol">Mã cổ phiếu (Tuỳ chọn)</label>
              <input type="text" id="noteSymbol" placeholder="VD: FPT" maxlength="20" style="text-transform: uppercase;" />
            </div>
            <div class="field-row">
              <label for="noteTags">Tags (Cách nhau bởi dấu phẩy)</label>
              <input type="text" id="noteTags" placeholder="VD: bài học, fomo, chốt non" />
            </div>
            <div class="field-row">
              <label for="noteContent">Nội dung <span class="required">*</span></label>
              <textarea id="noteContent" rows="4" required placeholder="Ghi lại kinh nghiệm hoặc lý do mua/bán..."></textarea>
            </div>
            <div class="actions">
              <button type="submit">Lưu Nhật Ký</button>
            </div>
          </form>
        </article>

        <article class="panel" style="grid-column: 1 / -1;">
          <h2>Danh sách Ghi chép</h2>
          <div id="notesList">
            <div class="card muted">Đang tải dữ liệu...</div>
          </div>
        </article>
      </section>
    </main>

    <script src="/static/toast.js"></script>
    <script src="/static/ui_cache.js"></script>
    <script src="/static/navbar.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const noteForm = document.getElementById("noteForm");
        const notesList = document.getElementById("notesList");

        async function fetchNotes() {
          try {
            const res = await fetch("/api/notes");
            if (!res.ok) throw new Error("Failed to fetch notes");
            const data = await res.json();
            renderNotes(data);
          } catch (e) {
            notesList.innerHTML = `<div class="card muted error">Lỗi tải nhật ký: ${e.message}</div>`;
          }
        }

        function renderNotes(notes) {
          if (!notes.length) {
            notesList.innerHTML = `<div class="card muted">Chưa có ghi chép nào. Mời bạn thêm mới!</div>`;
            return;
          }
          
          notesList.innerHTML = notes.map(n => {
            const dateStr = new Date(n.created_at).toLocaleString('vi-VN');
            let tagsArr = [];
            try { tagsArr = JSON.parse(n.tags_json); } catch(e) {}
            const tagsHtml = tagsArr.length ? `<span class="note-tags">🏷️ ${tagsArr.join(', ')}</span>` : '';
            const symbolHtml = n.symbol ? `<span class="note-symbol">${n.symbol}</span>` : `<span class="note-symbol" style="color:var(--text-muted)">Chung</span>`;
            
            return `
              <div class="note-card" data-id="${n.id}">
                <div class="note-header">
                  <div>
                    ${symbolHtml} &bull; ${tagsHtml}
                  </div>
                  <div style="display:flex; align-items:center; gap: 8px;">
                    <span class="note-date">${dateStr}</span>
                    <button class="delete-note" onclick="deleteNote(${n.id})" title="Xoá">🗑️</button>
                  </div>
                </div>
                <div class="note-content">${escapeHtml(n.content)}</div>
              </div>
            `;
          }).join('');
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        window.deleteNote = async function(id) {
            if (!confirm("Bạn có chắc chắn muốn xoá ghi chú này?")) return;
            try {
                const res = await fetch(`/api/notes/${id}`, { method: "DELETE" });
                if (!res.ok) throw new Error("Xoá thất bại");
                fetchNotes();
                showToast("Đã xoá ghi chú");
            } catch (e) {
                showToast("Lỗi: " + e.message, "error");
            }
        };

        noteForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = noteForm.querySelector("button[type='submit']");
          btn.disabled = true;

          const symbolRaw = document.getElementById("noteSymbol").value.trim();
          const tagsRaw = document.getElementById("noteTags").value.trim();
          const content = document.getElementById("noteContent").value.trim();
          
          let tags = [];
          if (tagsRaw) {
             tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);
          }

          const payload = {
              symbol: symbolRaw || null,
              tags_json: JSON.stringify(tags),
              content: content
          };

          try {
            const res = await fetch("/api/notes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error("Lưu nhật ký thất bại");
            
            showToast("Đã lưu nhật ký thành công");
            document.getElementById("noteSymbol").value = "";
            document.getElementById("noteTags").value = "";
            document.getElementById("noteContent").value = "";
            fetchNotes();
          } catch (err) {
            alert(err.message);
          } finally {
            btn.disabled = false;
          }
        });

        // Initialize
        fetchNotes();
      });
    </script>
  </body>
</html>
